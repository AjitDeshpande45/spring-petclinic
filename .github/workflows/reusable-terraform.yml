name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string   # dev | prod
      working-directory:
        required: false
        type: string
        default: terraform
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_KEY:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -input=false

      - name: Select or create workspace
        working-directory: ${{ inputs.working-directory }}
        run: |
          WORKSPACE=${{ inputs.environment }}
          if terraform workspace list | grep -q "^${WORKSPACE}$"; then
            terraform workspace select $WORKSPACE
          else
            terraform workspace new $WORKSPACE
          fi

      - name: Terraform Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: ${{ inputs.working-directory }}
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve

      - name: Get EC2 Public IP from Terraform
        id: get-ip
        working-directory: ${{ inputs.working-directory }}
        run: |
            PUBLIC_IP=$(terraform output -raw ec2_public_ip)
            echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Store PEM file as secret
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # PAT with repo scope
        run: |
          gh secret set PET_CLINIC_PEM_FILE_${{ inputs.environment }} --body "$(cat path/to/keyfile.pem)" --repo ${{ github.repository }}
          gh variable set PET_CLINIC_EC2_IP_${{ inputs.environment }} --body "${{ steps.get-ip.outputs.public_ip }}" --repo ${{ github.repository }}
