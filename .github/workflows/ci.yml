name: petclinic-ci-pipeline

on: 
  push:
    branches:
      - develop

jobs:
  checkout-validate:
    name: Checkout code & Validate Maven Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      
      - name: Validate project structure
        run: |
           ./mvnw validate --batch-mode --no-transfer-progress
      
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'

  security-scanning-testing:
    name: Security scanning and testing
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
        
    - name: Cache Maven Wrapper
      uses: actions/cache@v4
      with:
        path: ~/.m2/wrapper
        key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
            ${{ runner.os }}-maven-wrapper-

    - name: Install Dependencies mvn wrapper
      run: |
          ./mvnw dependency:go-offline --batch-mode --no-transfer-progress

    - name: Build Application with Maven Wrapper
      run: |
        ./mvnw clean compile

    - name: Run Unit Tests
      run: |
        ./mvnw test
        
    - name: Generate Test Coverage Report
      run: |
        ./mvnw jacoco:report

    - name: Build JAR Package
      run: |
        ./mvnw package -DskipTests

  docker-stage:
    name: Docker stage to build docker image
    runs-on: ubuntu-latest
    needs: [checkout-validate,security-scanning-testing ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/petclinic-app:${{ github.sha }}
      
      - name: Save Docker image tag as GitHub Variable
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh variable set DOCKER_TAG_IMAGE \
            --body "${{ github.sha }}" \
            --repo ${{ github.repository }}


  infra-terraform-steps:
    needs: [docker-stage ]
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: dev
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}

  deploy-to-dev:
      name: Deply to Dev
      needs: [infra-terraform-steps ]
      uses: ./.github/workflows/reusable-deployment.yml
      with:
        env: dev

        
  raise-prod-pr:
    runs-on: ubuntu-latest
    needs: [deploy-to-dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
        
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "PROD PR - Automated release" \
            --body "Update report
          - Updated with *today's* date
          - Auto-generated PR" \
            --label "report,automated pr" \
            --assignee ajit \
            --reviewer ajit